<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frpc Configurator - 配置</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="container-fluid">
        <div class="container nav-inner">
            <div class="brand">
                <span class="logo">FR</span>
                <span>Frpc Configurator</span>
            </div>
            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/config" class="active">Config</a></li>
                <li><a href="/settings">Settings</a></li>
            </ul>
        </div>
    </nav>

    <main class="container page config-page">
        <section class="config-layout">
            <div class="card config-manage">
                <div class="card-header">
                    <div>
                        <div class="eyebrow">Manage</div>
                        <h2>代理配置列表</h2>
                        <p class="muted">同端口 TCP/UDP 合并展示。</p>
                    </div>
                    <div class="header-actions">
                        <div class="hero-meta">共 {{ proxies|length }} 个代理</div>
                        <button type="button" class="icon-button" id="open-add-modal" aria-label="添加代理">+</button>
                    </div>
                </div>

                <div class="modal-overlay" id="add-proxy-modal" aria-hidden="true">
                    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="add-proxy-title">
                        <div class="modal-header">
                            <h3 id="add-proxy-title">添加代理</h3>
                            <button type="button" class="icon-button ghost" id="close-add-modal" aria-label="关闭">×</button>
                        </div>
                        <form method="POST" action="/add_proxy" class="stack">
                            <div class="grid">
                                <input type="text" name="name" placeholder="Proxy Name" required>
                                <div class="field radio-field">
                                    <label>Type</label>
                                    <div class="radio-group">
                                        <label class="radio-chip">
                                            <input type="radio" name="type" value="tcp" required>
                                            <span>TCP</span>
                                        </label>
                                        <label class="radio-chip">
                                            <input type="radio" name="type" value="udp" required>
                                            <span>UDP</span>
                                        </label>
                                    </div>
                                </div>
                                <input type="text" name="local_ip" placeholder="Local IP" value="127.0.0.1" required>
                                <input type="number" name="local_port" placeholder="Local Port" required>
                                <input type="number" name="remote_port" placeholder="Remote Port" required>
                            </div>
                            <div class="modal-actions">
                                <button type="button" class="secondary" id="cancel-add-modal">取消</button>
                                <button type="submit">添加代理</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="filter-toolbar">
                    <button type="button" class="filter-chip is-active" data-filter="all">全部</button>
                    <button type="button" class="filter-chip" data-filter="tcp">TCP</button>
                    <button type="button" class="filter-chip" data-filter="udp">UDP</button>
                    <button type="button" class="filter-chip" data-filter="visible">Visible</button>
                    <button type="button" class="filter-chip" data-filter="hidden">Unvisible</button>
                </div>

                {% if proxies %}
                <div class="proxy-list" id="proxy-list">
                    {% for proxy in proxies %}
                    <div class="proxy-item fade-in" data-types="{{ proxy.type }}" data-visible="{% if proxy.visible %}true{% else %}false{% endif %}">
                        <div class="proxy-item-header">
                            <div class="proxy-title">
                                <span class="badge">{{ proxy.type|upper }}</span>
                                <h3>{{ proxy.localIP }}:{{ proxy.localPort }}</h3>
                            </div>
                            <div class="proxy-header-actions">
                                <button onclick="updateProxy('{{ proxy.name }}')" class="secondary">更新</button>
                                <a href="/delete_proxy/{{ proxy.name }}" class="warning delete-btn" onclick="return confirm('确定要删除这个代理吗？此操作无法撤销')">删除</a>
                            </div>
                        </div>

                        <div class="proxy-group-items">
                            <div class="proxy-fields" data-type="{{ proxy.type }}" data-visible="{% if proxy.visible %}true{% else %}false{% endif %}">
                                <div class="field">
                                    <label>Display Name</label>
                                    <input type="text" name="display_name" value="{{ proxy.displayName }}"
                                           data-proxy="{{ proxy.name }}" class="display-name-input">
                                </div>
                                <div class="field field-toggle">
                                    <label>Visible</label>
                                    <label class="switch">
                                        <input type="checkbox" name="visible"
                                               {% if proxy.visible %}checked{% endif %}
                                               data-proxy="{{ proxy.name }}" class="visible-checkbox">
                                        <span class="slider"></span>
                                    </label>
                                </div>
                                <div class="field">
                                    <label>Local Port</label>
                                    <input type="number" name="local_port" value="{{ proxy.localPort }}" data-proxy="{{ proxy.name }}" class="local-port-input">
                                </div>
                                <div class="field">
                                    <label>Local IP</label>
                                    <input type="text" name="local_ip" value="{{ proxy.localIP }}" data-proxy="{{ proxy.name }}" class="local-ip-input">
                                </div>
                                <div class="field type-field">
                                    <label>Type</label>
                                    <select name="type" data-proxy="{{ proxy.name }}" class="type-select">
                                        <option value="tcp" {% if proxy.type == 'tcp' %}selected{% endif %}>TCP</option>
                                        <option value="udp" {% if proxy.type == 'udp' %}selected{% endif %}>UDP</option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label>Remote Port</label>
                                    <input type="number" name="remote_port" value="{{ proxy.remotePort }}" data-proxy="{{ proxy.name }}" class="remote-port-input">
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                {% else %}
                <p class="muted">暂无代理配置，请添加新代理。</p>
                {% endif %}
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        function updateProxy(proxyName) {
            const displayName = document.querySelector(`input[data-proxy="${proxyName}"].display-name-input`).value;
            const visible = document.querySelector(`input[data-proxy="${proxyName}"].visible-checkbox`).checked;
            const type = document.querySelector(`select[data-proxy="${proxyName}"].type-select`).value;
            const localIp = document.querySelector(`input[data-proxy="${proxyName}"].local-ip-input`).value;
            const localPort = document.querySelector(`input[data-proxy="${proxyName}"].local-port-input`).value;
            const remotePort = document.querySelector(`input[data-proxy="${proxyName}"].remote-port-input`).value;

            fetch('/edit_proxy/' + proxyName, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    display_name: displayName,
                    visible: visible,
                    type: type,
                    local_ip: localIp,
                    local_port: localPort,
                    remote_port: remotePort
                })
            }).then(response => {
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('更新失败');
                }
            });
        }
    </script>
</body>
</html>
